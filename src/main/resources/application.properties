spring.config.import=optional:file:.env[.properties]
# Chaves de um .env importado nao ativam profile sozinhas; uma variavel de ambiente real tem precedencia
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Spring Configs
spring.application.name=galene-api
server.port=7057
spring.threads.virtual.enabled=true

# Datasource
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Configs
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Web Configs
spring.data.web.pageable.max-page-size=100
spring.jackson.default-property-inclusion=non_null
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.error.include-stacktrace=never

# Security Configs (sem UserDetailsService: a autenticacao e feita por JWT proprio)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
galene.security.token-secret=${JWT_SECRET_TOKEN}
galene.security.access-token-ttl=PT5M
galene.security.refresh-token-ttl=P7D
galene.security.has-mfa=${HAS_MFA:true}

# Maileroo Configs
galene.mail.maileroo.base-url=https://smtp.maileroo.com/api/v2
galene.mail.maileroo.api-key=${MAILEROO_API_KEY}
galene.mail.maileroo.from-address=${MAILEROO_FROM_ADDRESS}
galene.mail.maileroo.from-name=${MAILEROO_FROM_NAME:Galene}
galene.mail.maileroo.connect-timeout=PT5S
galene.mail.maileroo.read-timeout=PT10S

# Job do relatório D-1 (horário de Brasília)
galene.reports.daily-cron=0 30 0 * * *

# Modo de teste do relatório (?testMode=true): só pode ser ligado nos perfis dev/test
galene.reports.test-mode-enabled=false
